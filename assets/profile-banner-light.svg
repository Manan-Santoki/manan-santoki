<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Manan Santoki</title>
  <desc id="desc">Build, ship, self-host. Developer tools, applied AI, and infrastructure.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bc4c00"/>
      <stop offset="1" stop-color="#9a6700"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d0d7de" stroke-width="1" opacity=".45"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="238" rx="18" fill="url(#background)" stroke="#d0d7de" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="238" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="9" height="240" rx="5" fill="url(#accent)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="64" y="58" fill="#57606a" font-size="17">manan@homelab:~$ ./build</text>
    <text x="64" y="124" fill="#1f2328" font-size="42" font-weight="700" letter-spacing="1">BUILD. SHIP. SELF-HOST.</text>
    <text x="66" y="170" fill="#57606a" font-size="20">developer tools  /  applied AI  /  infrastructure</text>
  </g>

  <g transform="translate(1014 51)">
    <rect width="126" height="138" rx="18" fill="#ffffff" stroke="#bc4c00" stroke-width="2"/>
    <path d="M26 35H100M26 103H100" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="26" cy="35" r="5" fill="#1a7f37"/>
    <text x="63" y="84" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="42" font-weight="700" text-anchor="middle">MS</text>
  </g>
